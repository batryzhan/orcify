[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orcify-research"
version = "0.1.0"
description = "Pure version-aware creative workflow research kernel"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "neo4j>=5.26,<7",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = [".", "packages"]
include = ["gamo_ca*", "services.api*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["packages/gamo_ca/tests", "services/api/tests", "tests"]
pythonpath = ["packages"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages"
files = ["packages/gamo_ca", "services/api/app", "scripts"]
